<!DOCTYPE html><html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pra Você 🌸</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, #ffccff, #ff66cc);
      font-family: "Comic Sans MS", cursive;
      overflow: hidden;
      cursor: url('https://cur.cursors-4u.net/nature/nat-10/nat936.cur'), auto;
    }h1 {
  color: white;
  text-align: center;
  font-size: 2rem;
  text-shadow: 0 0 10px #fff, 0 0 20px #ff00ff, 0 0 30px #ff66ff;
  animation: blink 1.2s infinite alternate;
  margin-bottom: 20px;
  padding: 0 20px;
}

marquee {
  color: yellow;
  font-size: 1.2rem;
  margin-bottom: 10px;
}

button {
  margin-top: 20px;
  padding: 10px 20px;
  font-size: 1rem;
  border: none;
  border-radius: 20px;
  background: hotpink;
  color: white;
  cursor: pointer;
  box-shadow: 0 0 10px white;
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.1); }
  100% { transform: scale(1); }
}

@keyframes blink {
  from { opacity: 0.6; }
  to { opacity: 1; }
}

.bouquet {
  width: 320px;
  animation: sparkle 2s infinite linear;
}

@keyframes sparkle {
  0% { filter: drop-shadow(0 0 5px white); }
  50% { filter: drop-shadow(0 0 25px yellow) drop-shadow(0 0 40px pink); }
  100% { filter: drop-shadow(0 0 5px white); }
}

.stars, .hearts, .trail {
  position: absolute;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.star {
  position: absolute;
  width: 8px;
  height: 8px;
  background: white;
  border-radius: 50%;
  animation: twinkle 2s infinite ease-in-out;
}

.heart {
  position: absolute;
  color: pink;
  font-size: 20px;
  animation: floatUp 4s linear infinite;
}

.spark {
  position: absolute;
  width: 6px;
  height: 6px;
  background: white;
  border-radius: 50%;
  pointer-events: none;
  animation: fade 1s linear forwards;
}

@keyframes fade {
  to { opacity: 0; transform: scale(2); }
}

@keyframes twinkle {
  0%, 100% { opacity: 0.2; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.5); }
}

@keyframes floatUp {
  0% { transform: translateY(100vh) scale(1); opacity: 1; }
  100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
}

  </style>
</head>
<body><marquee>💖 pra você 💖 pra você 💖 pra você 💖</marquee>

  <h1>Esqueci de te dar isso aqui ontem, você tava meio rabugento 💐</h1>  <img class="bouquet" src="https://media.giphy.com/media/26BRv0ThflsHCqDrG/giphy.gif" alt="Buquê de flores"><button onclick="mostrarMensagem()">Clica aqui 💌</button>

  <div class="stars" id="stars"></div>
  <div class="hearts" id="hearts"></div>
  <div class="trail" id="trail"></div>  <audio autoplay loop>
    <source src="https://www.myinstants.com/media/sounds/careless-whisper.mp3" type="audio/mpeg">
  </audio>  <script>
    const starsContainer = document.getElementById('stars');
    const heartsContainer = document.getElementById('hearts');
    const trail = document.getElementById('trail');

    for (let i = 0; i < 40; i++) {
      const star = document.createElement('div');
      star.classList.add('star');
      star.style.top = Math.random() * 100 + '%';
      star.style.left = Math.random() * 100 + '%';
      star.style.animationDelay = Math.random() * 2 + 's';
      starsContainer.appendChild(star);
    }

    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.innerHTML = '💖';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
      heartsContainer.appendChild(heart);
      setTimeout(() => heart.remove(), 4000);
    }

    setInterval(createHeart, 300);

    function mostrarMensagem() {
      alert('Agora você não pode mais ficar rabugento comigo 😌💖');
    }

    // rastro de glitter no mouse
    document.addEventListener('mousemove', function(e) {
      const spark = document.createElement('div');
      spark.classList.add('spark');
      spark.style.left = e.pageX + 'px';
      spark.style.top = e.pageY + 'px';
      trail.appendChild(spark);
      setTimeout(() => spark.remove(), 1000);
    });
  </script></body>
</html>
